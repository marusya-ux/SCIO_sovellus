{% extends "layout.html" %}

{% block content %}

<h1>{{ user.username }}</h1>

<p>
    Publications: {{ posts|length }}
</p>

<h2>Publications</h2>

<ul>
{% for post in posts %}
    <li>
        <a href="/edit/{{ post.id }}">
            {{ post.title }}
        </a>
    </li>
{% endfor %}
</ul>

{% endblock %}
